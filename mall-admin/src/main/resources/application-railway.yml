server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-message: always
    include-stacktrace: always

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    druid:
      initial-size: 1
      min-idle: 1
      max-active: 3
  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT}
    password: ${REDIS_PASSWORD}
    database: 0
    timeout: 3000ms
    lettuce:
      shutdown-timeout: 100ms

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  bucketName: mall
  accessKey: ${MINIO_ACCESS_KEY:minioadmin}
  secretKey: ${MINIO_SECRET_KEY:minioadmin}

logging:
  level:
    root: warn
    com.macro.mall: debug
    org.springframework.boot: debug
    org.springframework.security: debug
